name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The Current starts a build when a newsletter is published (supabase/functions/newsletter-build).
  workflow_dispatch:
  # Every night at 02:30 in Hội An (19:30 UTC), so dated things (the reel, newsletter notices) keep up.
  schedule:
    - cron: '30 19 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Work out the path prefix
        id: prefix
        run: |
          if [ -f src/CNAME ]; then
            echo "prefix=/" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
          fi
      - run: npx @11ty/eleventy
        env:
          PATH_PREFIX: ${{ steps.prefix.outputs.prefix }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
